<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CredTrack — Credit & Expense Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            brand: { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',
                     400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',
                     800:'#3730a3',900:'#312e81' }
          },
          keyframes: {
            fadeIn:  {'0%':{opacity:0}, '100%':{opacity:1}},
            slideUp: {'0%':{opacity:0, transform:'translateY(10px)'}, '100%':{opacity:1, transform:'translateY(0)'}}
          },
          animation: { fadeIn:'fadeIn .3s ease-out', slideUp:'slideUp .4s ease-out' }
        }
      }
    };
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='22' font-size='18' font-weight='700' text-anchor='middle' fill='white' font-family='sans-serif'%3EC%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="font-sans bg-slate-50 text-slate-800 antialiased">
  <div id="app"></div>
  <script src="vendor/three.min.js"></script>
  <script src="dashboard3d.js"></script>
  <script src="app.js"></script>
</body>
</html>
